version: '3.8'

services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: shepherds_db
    environment:
      POSTGRES_DB: ${DB_NAME:-shepherd_toolkit}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Django
  web:
    build: .
    container_name: shepherds_api
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      # Django settings
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me}
      DJANGO_SETTINGS_MODULE: config.settings

      # Database
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-shepherd_toolkit}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432

      # ALLOWED_HOSTS
      ALLOWED_HOSTS: localhost,127.0.0.1,web

      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000

      # Bible population
      POPULATE_BIBLE: ${POPULATE_BIBLE:-false}
      BIBLE_VERSION: ${BIBLE_VERSION:-ACF}
      BIBLE_SOURCE: ${BIBLE_SOURCE:-api}

      # Superuser creation
      CREATE_SUPERUSER: ${CREATE_SUPERUSER:-false}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-password123}
      CHURCH_NAME: ${CHURCH_NAME:-Igreja Central}

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      db:
        condition: service_healthy

    networks:
      - shepherds_network

volumes:
  postgres_data:

networks:
  shepherds_network:
    driver: bridge